<!DOCTYPE html>
<html lang="en">
<head>

    <!-- Apply saved theme before paint, to avoid a flash of the wrong theme -->
    <script>
        (function () {
            var saved = localStorage.getItem("drwallet_theme");
            var theme = saved || (window.matchMedia && window.matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light");
            document.documentElement.setAttribute("data-theme", theme);
        })();
    </script>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sign In | Dr. Wallet</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700;800&family=Sora:wght@600;700;800&family=JetBrains+Mono:wght@500;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css">

    <link rel="stylesheet" href="css/variables.css">
    <link rel="stylesheet" href="css/navbar.css">
    <link rel="stylesheet" href="css/footer.css">
    <link rel="stylesheet" href="css/components.css">
    <link rel="stylesheet" href="css/forms.css">
    <link rel="stylesheet" href="css/signin.css">
    <link rel="stylesheet" href="css/responsive.css">

</head>
<body>

    <header class="site-header">
        <nav class="navbar">

            <a href="home.html" class="logo">
                <i class="fa-solid fa-wallet"></i>
                <span>Dr. Wallet</span>
            </a>

            <input type="checkbox" id="nav-toggle" class="nav-toggle">
            <label for="nav-toggle" class="nav-toggle-label">
                <span></span><span></span><span></span>
            </label>

            <ul class="nav-links">
                <li><a href="home.html">Home</a></li>
                <li><a href="home.html#about">About</a></li>
                <li><a href="home.html#features">Features</a></li>
                <li><a href="contact.html">Contact</a></li>
                <li class="mobile-auth-slot">
                    <div id="authSlotMobile"></div>
                </li>
            </ul>

            <div class="nav-buttons">
                <button type="button" class="theme-toggle" id="themeToggle" aria-label="Toggle dark mode">
                    <i class="fa-solid fa-sun"></i>
                    <i class="fa-solid fa-moon"></i>
                </button>
                <div id="authSlot">
                    <a href="signin.html" class="btn btn-ghost">Sign In</a>
                    <a href="signup.html" class="btn btn-primary">Sign Up</a>
                </div>
            </div>

        </nav>
    </header>

    <main class="auth-wrap">

        <div class="auth-card signin-card">

            <div class="auth-head">
                <a href="home.html" class="logo">
                    <i class="fa-solid fa-wallet"></i>
                    <span>Dr. Wallet</span>
                </a>
                <h1>Welcome back</h1>
                <p>Sign in to keep tracking your spending.</p>
            </div>

            <form id="signinForm" novalidate>

                <div class="form-group">
                    <label for="name">Full Name *</label>
                    <input type="text" id="name" name="name" placeholder="e.g. Aditi Sharma" autocomplete="name">
                    <span class="error-text" data-error-for="name"></span>
                </div>

                <div class="form-group">
                    <label for="email">Email Address *</label>
                    <input type="email" id="email" name="email" placeholder="you@example.com" autocomplete="email">
                    <span class="error-text" data-error-for="email"></span>
                </div>

                <div class="form-group">
                    <label for="password">Password *</label>
                    <div class="password-field">
                        <input type="password" id="password" name="password" placeholder="Your password" autocomplete="current-password">
                        <button type="button" class="toggle-password"><i class="fa-solid fa-eye"></i></button>
                    </div>
                    <span class="error-text" data-error-for="password"></span>
                </div>

                <div class="form-group">
                    <label>Captcha *</label>
                    <div class="captcha-row">
                        <div class="captcha-box" id="captchaText"></div>
                        <button type="button" class="captcha-refresh" id="refreshCaptcha" aria-label="Refresh captcha">
                            <i class="fa-solid fa-rotate"></i>
                        </button>
                    </div>
                    <input type="text" id="captcha" name="captcha" placeholder="Enter the code shown above" autocomplete="off">
                    <span class="error-text" data-error-for="captcha"></span>
                </div>

                <button type="submit" class="btn btn-primary auth-submit">Sign In</button>

            </form>

            <p class="auth-switch">Don't have an account? <a href="signup.html">Sign Up</a></p>

        </div>

    </main>

    <div id="toast-container"></div>

    <script src="js/theme.js"></script>
    <script src="js/captcha.js"></script>
    <script src="js/auth.js"></script>
    <script src="js/signin.js"></script>

</body>
</html>
