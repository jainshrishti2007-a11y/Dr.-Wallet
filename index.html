<!DOCTYPE html>
<html lang="en">
<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Dr. Wallet</title>

    <!-- No meta-refresh here anymore — js/loading.js drives the timing
         and does a smooth fade into home.html instead of a hard jump. -->

    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@600;700&display=swap" rel="stylesheet">

    <!-- Font Awesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css">

    <!-- CSS -->
    <link rel="stylesheet" href="css/loading.css">

</head>
<body>

    <main class="loader-container" id="loaderContainer">

        <div class="load-brand">
            <i class="fa-solid fa-wallet"></i>
            <span>Dr. Wallet</span>
        </div>

        <div class="load-percent-zone">
            <span class="load-percent" id="loadPercent">0%</span>
        </div>

        <div class="load-bar-track">
            <div class="load-bar-fill" id="loadBarFill"></div>
        </div>

        <div class="load-message-zone">
            <p class="load-status" id="loadStatus">Setting things up&hellip;</p>
            <p class="load-welcome" id="loadWelcome">Welcome to Dr. Wallet!</p>
        </div>

    </main>

    <script src="js/loading.js"></script>

</body>
</html>
